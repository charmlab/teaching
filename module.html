<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module &middot; The AI Learning Map</title>
<meta name="description" content="A module of The AI Learning Map by Amir-Hossein Karimi: interactive lessons, lecture videos, and curated resources.">
<link rel="canonical" href="https://teaching.amirhkarimi.com/">
<link href="https://fonts.googleapis.com/css?family=Raleway:400,300,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .module-hero { padding: 30px 0 0; }
  .crumb { font-size: 12.5px; color: var(--muted); letter-spacing: 0.5px; }
  .crumb a { color: var(--muted); }
  .crumb a:hover { color: var(--accent-dark); }
  h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 600; letter-spacing: -0.8px; margin-top: 6px; }
  .module-hero .blurb { color: var(--text); font-size: 15.5px; margin-top: 12px; font-weight: 300; }
  .module-hero .meta { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .module-hero .meta b { color: var(--text); font-weight: 600; }
  .prereq-chips a.chip { cursor: pointer; }

  /* ---------- lesson list (modules with lessons) ---------- */
  .lessons-label { font-size: 11.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .lessons { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
  .lesson-card { display: flex; gap: 16px; align-items: center; padding: 12px 16px; border: 1px solid var(--line);
    border-radius: 12px; background: #fff; color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .lesson-card:hover { border-color: var(--accent-primary); box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
  .lc-num { flex: 0 0 34px; height: 34px; border-radius: 50%; background: #eef8fd; color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; }
  .lc-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .lc-title { font-weight: 600; font-size: 16px; color: var(--text); }
  .lc-blurb { font-size: 13px; color: var(--muted); font-weight: 300; line-height: 1.5; }
  .lc-badges { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .lc-go { color: var(--muted); font-size: 20px; }
  .lesson-card:hover .lc-go { color: var(--accent-dark); }
  @media (max-width: 560px) { .lesson-card { padding: 14px; gap: 12px; } .lc-go { display: none; } .lc-title { font-size: 16px; } }

  /* ---------- "where this fits" map, beside the hero ---------- */
  .mod-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 40px; align-items: start; }
  .mod-main { min-width: 0; }
  #minimap { position: sticky; top: 76px; margin-top: 30px; padding: 12px 12px 10px; border: 1px solid var(--line);
    border-radius: 14px; background: #fff; box-shadow: var(--shadow-card); }
  #minimap .mm-title { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  #minimap svg { width: 100%; height: auto; display: block; overflow: visible; }
  #minimap g.mm-node { cursor: pointer; }
  #minimap g.mm-node.cur { cursor: default; }
  #minimap g.mm-node:not(.cur):hover rect { stroke: var(--accent-primary); stroke-width: 1.6; fill: #eef8fd; }
  #minimap g.mm-node.hop rect { fill: var(--accent-primary); stroke: var(--accent-dark); }
  #minimap .mm-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 11px; color: var(--muted); margin-top: 10px; }
  #minimap .mm-legend i { display: inline-block; width: 12px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #minimap .label { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 6px; }
  @keyframes mm-pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(1.5); } }
  #minimap .mm-halo { transform-box: fill-box; transform-origin: center; animation: mm-pulse 2.2s ease-in-out infinite; }
  @media (max-width: 1000px) {
    .mod-grid { grid-template-columns: 1fr; gap: 0; }
    .mod-main { display: contents; }
    #hero { order: 1; } #minimap { order: 2; position: static; width: 100%; max-width: 440px; margin: 16px 0 0; }
    #step-nav { order: 3; } #sections { order: 4; } #next-prev { order: 5; }
  }

  /* ---------- step nav ---------- */
  .step-nav {
    display: flex; gap: 8px; margin: 26px 0 8px; position: sticky; top: 53px;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(6px);
    padding: 10px 0; z-index: 70; border-bottom: 1px solid var(--line);
  }
  .step-nav a {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: var(--radius-pill);
    padding: 6px 14px; font-size: 13px; color: var(--text); font-weight: 600;
    transition: all .15s;
  }
  .step-nav a:hover, .step-nav a.current { border-color: var(--accent-primary); color: var(--accent-dark); }
  .step-nav .n {
    width: 20px; height: 20px; border-radius: 50%; background: var(--accent-primary);
    color: #fff; font-size: 11.5px; display: flex; align-items: center; justify-content: center;
  }

  /* ---------- flow sections ---------- */
  section.flow { padding: 36px 0 8px; max-width: 760px; scroll-margin-top: 110px; }
  section.flow .eyebrow {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-dark); font-weight: 600;
  }
  section.flow h2 { font-size: 23px; font-weight: 600; margin-top: 2px; }
  section.flow .desc { color: var(--muted); font-size: 14px; margin-top: 6px; font-weight: 300; }
  .placeholder {
    margin-top: 16px; border: 1.5px dashed #d5d5d5; border-radius: var(--radius-card);
    padding: 34px 26px; text-align: center; color: var(--muted); background: #fcfcfc;
  }
  .placeholder .big { font-size: 30px; }
  .placeholder p { font-size: 13.5px; max-width: 460px; margin: 8px auto 0; }
  .placeholder .actions { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  .next-prev { display: flex; justify-content: space-between; margin: 44px 0 10px; max-width: 760px; gap: 10px; }

  /* ---------- resources ---------- */
  .resource {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--line); border-radius: var(--radius-card);
    padding: 11px 16px; margin-top: 10px; color: var(--text); transition: all .15s;
  }
  .resource:hover { border-color: var(--accent-primary); box-shadow: var(--shadow-card); color: var(--text); }
  .resource .icon { font-size: 18px; }
  .resource .h { font-weight: 600; font-size: 13.5px; }
  .resource .u { font-size: 11.5px; color: var(--muted); }
  .resources-empty {
    margin-top: 12px; border: 1.5px dashed #d5d5d5; border-radius: var(--radius-card);
    padding: 18px; text-align: center; color: var(--muted); font-size: 13px; background: #fcfcfc;
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap inner">
    <span class="brand"><a href="index.html" style="color:var(--text)">Amir-Hossein Karimi &middot; <span class="teaching">Teaching</span></a></span>
    <span class="links">
      <a href="index.html" id="back-link">&larr; back to the map</a>
      <button class="lang-btn" id="lang-btn" title="Switch language / تغییر زبان">فا</button>
      <a href="https://amirhkarimi.com" target="_blank">amirhkarimi.com</a>
    </span>
  </div>
</nav>

<main class="wrap">
  <div class="mod-grid">
    <div class="mod-main">
      <header class="module-hero" id="hero"></header>
      <div class="step-nav" id="step-nav"></div>
      <div id="sections"></div>
      <div class="next-prev" id="next-prev"></div>
    </div>
    <aside id="minimap" aria-label="Where this module fits on the map">
      <div class="mm-title">Where this fits</div>
      <svg id="minimap-svg"></svg>
      <div class="mm-legend">
        <span><i style="background:var(--accent-primary)"></i>You are here</span>
        <span><i style="background:#e3f1d6;border:1.5px solid #3b6d11"></i>Builds on</span>
        <span><i style="background:#fff4e0;border:1.5px dashed #b8842b"></i>Leads to</span>
      </div>
      <div class="label" id="minimap-label">click any module to jump there</div>
    </aside>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap" id="footer-text">Sequence may evolve based on feedback and emerging technology. &middot; &copy; 2026 Amir-Hossein Karimi</div>
</footer>

<script src="data.js"></script>
<script src="lessons.js"></script>
<script>
const params = new URLSearchParams(location.search);
const mod = byId[params.get("id")] || byId["c-ml"];
const mode = params.get("mode");
document.title = `${mod.title} · The AI Learning Map`;
document.querySelector('meta[name="description"]').content = `${mod.title}: ${mod.blurb}`.slice(0, 300);
document.querySelector('link[rel="canonical"]').href = `https://teaching.amirhkarimi.com/module.html?id=${mod.id}`;
track("module_view", { module_id: mod.id, mode: mode || "(none)", reference: !!mod.ref });

const RES_ICON = { video: "\u{1F3A5}", website: "\u{1F310}", pdf: "\u{1F4C4}", book: "\u{1F4D8}" };

/* ---------- hero ---------- */
function renderHero() {
  const lang = getLang();
  const title = (lang === "fa" && mod.title_fa) ? mod.title_fa : mod.title;
  // a junction dot isn't a module: show the modules feeding into it instead
  const prereqIds = [].concat(...mod.prereqs.map(p => byId[p].junction ? byId[p].prereqs : [p]));
  const prereqChips = prereqIds.length
    ? prereqIds.map(p => {
        const pt = (lang === "fa" && byId[p].title_fa) ? byId[p].title_fa : byId[p].title;
        return `<a class="chip aud" href="module.html?id=${p}">${pt}</a>`;
      }).join("")
    : `<span class="chip planned">None &mdash; start here</span>`;
  const S = STRINGS[lang];
  const TL = lang === "fa" ? TIER_LABEL_FA : TIER_LABEL;
  const tierDisplay = TL[mod.tier] || mod.tier;
  document.getElementById("hero").innerHTML = `
    <div class="crumb"><a href="index.html">The AI Learning Map</a> / ${tierDisplay}</div>
    <h1>${title}</h1>
    <div>${mod.aud.map(a => `<span class="chip aud">${S.audience[a] || AUD_LABEL[a]}</span>`).join("")}</div>
    <p class="blurb">${mod.blurb}</p>
`;  // prerequisites are shown on the "Where this fits" map
}

/* ---------- step nav + sections ---------- */
const STEPS_EN = ["listen","play","build","quiz"];
const STEP_ICONS = { listen:"\u{1F3A7}", play:"\u{1F3AE}", build:"\u{1F528}", quiz:"\u{2705}" };

function renderSections() {
  const lang = getLang();
  const S = STRINGS[lang];

  // Modules with lessons: the page is simply the list of lessons, in order.
  const lessonSlugs = (window.MODULE_LESSONS || {})[mod.id];
  if (lessonSlugs) {
    document.getElementById("step-nav").style.display = "none";
    document.getElementById("sections").innerHTML = `
      <div class="lessons-label">${lessonSlugs.length} lessons &middot; read, play, and watch at your own pace</div>
      <div class="lessons">
      ${lessonSlugs.map((slug, i) => {
        const L = LESSONS[slug], st = lessonStats(slug);
        const badges = [
          st.clips ? `&#9654; ${st.clips} lecture clip${st.clips > 1 ? "s" : ""} &middot; ${st.minutes} min` : "",
          "&#128214; interactive reading",
          "&#9989; quiz",
        ].filter(Boolean).map(b => `<span>${b}</span>`).join("");
        return `<a class="lesson-card" href="modules/c-ml/${slug}/index.html"
                  onclick="track('lesson_open',{module_id:'${mod.id}',lesson:'${slug}'})">
          <span class="lc-num">${i + 1}</span>
          <span class="lc-body">
            <span class="lc-title">${L.title}</span>
            <span class="lc-blurb">${L.blurb}</span>
            <span class="lc-badges">${badges}</span>
          </span>
          <span class="lc-go">&rarr;</span>
        </a>`;
      }).join("")}
      </div>
      ${(() => {
        const extras = (mod.resources || []).filter(r => !r.url.startsWith("modules/"));
        return extras.length ? `<div class="lessons-label">Learn more from the best</div>
          <div class="extras">${extras.map(r => `
            <a class="resource" href="${r.url}" target="_blank" rel="noopener"
               onclick="track('resource_click',{module_id:'${mod.id}',resource:'${r.url}'})">
              <span class="icon">${RES_ICON[r.type] || RES_ICON.website}</span>
              <span><div class="h">${r.title}</div><div class="u">${r.url.replace(/^https?:\/\//, "")}</div></span>
            </a>`).join("")}</div>` : "";
      })()}`;
    return;
  }

  // Step nav
  if (!mod.ref) {
    document.getElementById("step-nav").innerHTML = STEPS_EN.map((k, i) => {
      const ingData = S.ing[k];
      const name = ingData ? ingData.name : (k === "quiz" ? (lang === "fa" ? "آزمون" : "Quiz") : k);
      const tag  = ingData ? ingData.tag  : (k === "quiz" ? (lang === "fa" ? "خودآزمایی" : "self-check") : "");
      return `<a href="#${k}" data-k="${k}">
        <span class="n">${i + 1}</span>${name}
        <span class="muted-tag" style="font-weight:400;color:var(--muted)">&middot; ${tag}</span>
      </a>`;
    }).join("");
  }

  // Resources HTML
  const resourcesHtml = mod.resources && mod.resources.length
    ? mod.resources.map(r => `
        <a class="resource" href="${r.url}" target="_blank" rel="noopener"
           onclick="track('resource_click',{module_id:'${mod.id}',resource:'${r.url}'})">
          <span class="icon">${RES_ICON[r.type] || RES_ICON.website}</span>
          <span><div class="h">${r.title}</div><div class="u">${r.url.replace(/^https?:\/\//, "")}</div></span>
        </a>`).join("")
    : `<div class="resources-empty">${S.resources_empty}</div>`;

  if (mod.ref) {
    document.getElementById("step-nav").style.display = "none";
    document.getElementById("sections").innerHTML = `
      <section class="flow" id="resources">
        <div class="eyebrow">Reference module</div>
        <h2>${S.ref_resources_title}</h2>
        <p class="desc">${S.ref_resources_sub} ${mod.title}.</p>
        ${resourcesHtml}
      </section>`;
    return;
  }

  // --- Listen section — auto-detect PDF from assets/ ---
  const listenHtml = `
    <section class="flow" id="listen">
      <div class="eyebrow">Step 1 &middot; ${S.ing.listen.tag}</div>
      <h2>${STEP_ICONS.listen} ${S.ing.listen.name}</h2>
      <p class="desc">${S.ing.listen.desc}</p>

      <div id="pdf-area" style="margin-top:16px">
        <div class="placeholder" id="pdf-loading">
          <div class="big">⏳</div>
          <p style="color:var(--muted);font-size:13px">Checking for lecture notes…</p>
        </div>
      </div>

      <div class="placeholder" style="margin-top:16px">
        <div class="big">${STEP_ICONS.listen}</div>
        <p>Lecture recording and podcast version coming soon.</p>
        <div class="actions">
          <button class="btn" disabled>Watch lecture</button>
          <button class="btn" disabled>Listen as podcast</button>
        </div>
      </div>
    </section>`;

  // --- Play section ---
  const playHtml = `
    <section class="flow" id="play">
      <div class="eyebrow">Step 2 &middot; ${S.ing.play.tag}</div>
      <h2>${STEP_ICONS.play} ${S.ing.play.name}</h2>
      <p class="desc">${S.ing.play.desc}</p>
      <div id="play-content">
        <div class="placeholder">
          <div class="big">${STEP_ICONS.play}</div>
          <p>Interactive course notes under construction &mdash; readable theory with live, manipulable visualizations of the algorithms (KaTeX + animations).</p>
          <div class="actions"><button class="btn" disabled>Open interactive notes</button></div>
        </div>
      </div>
    </section>`;

  // --- Build section ---
  const buildHtml = `
    <section class="flow" id="build">
      <div class="eyebrow">Step 3 &middot; ${S.ing.build.tag}</div>
      <h2>${STEP_ICONS.build} ${S.ing.build.name}</h2>
      <p class="desc">${S.ing.build.desc}</p>
      <div class="placeholder">
        <div class="big">${STEP_ICONS.build}</div>
        <p>A guided Python notebook where you implement the ideas yourself and get feedback on your work.</p>
        <div class="actions">
          <button class="btn" disabled>Open notebook</button>
          <button class="btn" disabled>Open in Colab</button>
        </div>
      </div>
    </section>`;

  // --- Quiz section ---
  const quizLabel = lang === "fa" ? "آزمون" : "Quiz";
  const quizTag   = lang === "fa" ? "خودآزمایی" : "self-check";
  const quizHtml  = buildQuizSection(lang);

  // --- Resources section ---
  const resourcesSection = `
    <section class="flow" id="resources">
      <div class="eyebrow">Optional &middot; go deeper</div>
      <h2>${S.resources_title}</h2>
      <p class="desc">${S.resources_sub}</p>
      ${resourcesHtml}
    </section>`;

  document.getElementById("sections").innerHTML =
    listenHtml + playHtml + buildHtml + quizHtml + resourcesSection;

  // Auto-detect lecture PDF from assets/
  autoDetectPDF();
  // Auto-inject module-specific play content
  autoDetectPlay();
}

/* ---------- PDF auto-detect (checks assets/manual.pdf then assets/generated.pdf) ---------- */
async function autoDetectPDF() {
  const base = `modules/${mod.id}/assets`;
  const candidates = [
    { path: `${base}/manual.pdf`,    label: mod.title },
    { path: `${base}/generated.pdf`, label: mod.title },
  ];
  const area = document.getElementById("pdf-area");
  if (!area) return;
  for (const { path, label } of candidates) {
    try {
      const r = await fetch(path, { method: "HEAD" });
      if (r.ok) {
        area.innerHTML = `
          <div style="border:1px solid var(--line);border-radius:var(--radius-card);overflow:hidden;margin-top:4px">
            <div style="padding:7px 12px;font-size:12px;color:var(--muted);background:#f8f8f8;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
              <span>📄 ${label}</span>
              <a href="${path}" target="_blank" style="font-size:12px;font-weight:600">Open in new tab ↗</a>
            </div>
            <iframe src="${path}" title="Lecture notes" style="width:100%;height:540px;border:none;display:block"></iframe>
          </div>`;
        track("pdf_auto_load", { module_id: mod.id, pdf_path: path });
        return;
      }
    } catch {}
  }
  // No PDF found — show a quiet placeholder
  area.innerHTML = `
    <div style="border:1.5px dashed #d5d5d5;border-radius:var(--radius-card);padding:22px;text-align:center;color:var(--muted);background:#fcfcfc;font-size:13px">
      Lecture notes not yet published — run <code style="background:#f0f0f0;padding:2px 6px;border-radius:4px">make listen MODULE=${mod.id}</code> to generate them.
    </div>`;
}

/* ---------- Play content auto-detect ---------- */
async function autoDetectPlay() {
  const area = document.getElementById("play-content");
  if (!area) return;
  try {
    const r = await fetch(`modules/${mod.id}/play.html`, { method: "HEAD" });
    if (!r.ok) return;
    const html = await fetch(`modules/${mod.id}/play.html`).then(r => r.text());
    area.innerHTML = html;
    // Execute any <script> tags in the injected HTML
    area.querySelectorAll("script").forEach(old => {
      const s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  } catch {}
}

/* ---------- Quiz section builder ---------- */
function buildQuizSection(lang) {
  const quizLabel = lang === "fa" ? "آزمون" : "Quiz";
  const quizTag   = lang === "fa" ? "خودآزمایی" : "self-check";
  const quiz = mod.quiz || [];

  let innerHtml;
  if (quiz.length === 0) {
    innerHtml = `
      <div class="placeholder" style="margin-top:16px">
        <div class="big">✅</div>
        <p>${lang === "fa"
          ? "سوالات آزمون برای این ماژول به زودی اضافه می‌شود."
          : "Quiz questions for this module are on their way. Check back after the lecture."}</p>
      </div>`;
  } else {
    const mcqs = quiz.filter(q => q.opts);
    const open = quiz.filter(q => !q.opts);
    innerHtml = mcqs.map((q, qi) => `
      <div class="quiz-q" id="qq-${qi}">${q.q}${q.marks ? `<span class="marks">[${q.marks} mark${q.marks>1?"s":""}]</span>` : ""}
      </div>
      <div class="quiz-opts">${q.opts.map((opt, oi) =>
        `<button onclick="pickOpt(${qi},${oi},${q.ans})">${opt}</button>`
      ).join("")}</div>
    `).join("") + open.map((q, qi) => `
      <div class="quiz-open">
        <div class="open-q">${q.q}${q.marks ? `<span class="marks">[${q.marks} mark${q.marks>1?"s":""}]</span>` : ""}</div>
        <div class="open-hint">${lang === "fa" ? "پاسخ خود را اینجا بنویسید..." : "Work it out on paper, then check your notes."}</div>
      </div>
    `).join("");
    if (mcqs.length) {
      innerHtml += `<div style="margin-top:14px">
        <button class="btn primary" onclick="checkQuiz(${mcqs.length})">
          ${lang === "fa" ? "بررسی پاسخ‌ها" : "Check answers"}
        </button>
        <span class="quiz-score" id="quiz-score"></span>
      </div>`;
    }
  }

  return `
    <section class="flow" id="quiz">
      <div class="eyebrow">Step 4 &middot; ${quizTag}</div>
      <h2>✅ ${quizLabel}</h2>
      <p class="desc">${lang === "fa"
        ? "چند سوال کوتاه برای بررسی درک شما از این ماژول."
        : "A few short questions to test your understanding of this module."}</p>
      ${innerHtml}
    </section>`;
}

/* Quiz MCQ interactions */
const quizSelections = {};
function pickOpt(qi, oi, correct) {
  quizSelections[qi] = oi;
  const container = document.querySelectorAll(".quiz-opts")[qi];
  container.querySelectorAll("button").forEach((btn, i) => {
    btn.classList.toggle("selected", i === oi);
  });
}
function checkQuiz(total) {
  let score = 0;
  for (let qi = 0; qi < total; qi++) {
    const quiz = mod.quiz.filter(q => q.opts);
    const correct = quiz[qi].ans;
    const chosen  = quizSelections[qi];
    const container = document.querySelectorAll(".quiz-opts")[qi];
    if (!container) continue;
    container.querySelectorAll("button").forEach((btn, oi) => {
      btn.classList.remove("correct","wrong");
      if (oi === correct)              btn.classList.add("correct");
      else if (oi === chosen && oi !== correct) btn.classList.add("wrong");
    });
    if (chosen === correct) score++;
  }
  const lang = getLang();
  document.getElementById("quiz-score").textContent = lang === "fa"
    ? `${score} از ${total} درست`
    : `${score} / ${total} correct`;
}

/* ---------- next / prev within the audience path ---------- */
function renderNextPrev() {
  const lang = getLang();
  const aud = mod.aud.includes(getAudience()) ? getAudience() : mod.aud[0];
  const steps = (PATHS[aud] || PATHS.student).steps.map(s => s.id);
  const idx = steps.indexOf(mod.id);
  const np = [];
  if (idx > 0) {
    const prev = byId[steps[idx-1]];
    const prevTitle = (lang === "fa" && prev.title_fa) ? prev.title_fa : prev.title;
    np.push(`<a class="btn" href="module.html?id=${prev.id}">&larr; ${prevTitle}</a>`);
  } else np.push("<span></span>");
  if (idx >= 0 && idx < steps.length - 1) {
    const next = byId[steps[idx+1]];
    const nextTitle = (lang === "fa" && next.title_fa) ? next.title_fa : next.title;
    np.push(`<a class="btn primary" href="module.html?id=${next.id}">${nextTitle} &rarr;</a>`);
  }
  document.getElementById("next-prev").innerHTML = np.join("");
}

/* ---------- mini skill tree ---------- */
(function renderMinimap() {
  const LABEL = { "f-la":"Lin. Algebra", "f-calc":"Calculus", "f-prob":"Prob & Stats", "f-opt":"Optimization", "f-prog":"Python",
    "c-intro":"AI Literacy", "c-flu":"AI Fluency", "x-rai":"AI Ethics", "c-ml":"Classical ML", "c-nn":"Neural Nets",
    "x-unsup":"Unsupervised", "x-rl":"Reinforcement", "a-vision":"Vision", "a-nlp":"Language", "a-robotics":"Robotics",
    "a-agents":"Agents", "a-systems":"MLOps", "s-causal":"Causal AI", "s-xai":"Explainable", "s-nsai":"Neuro-symbolic" };
  const W = 360, NW = 66, NH = 21, UY = 40, PADM = 12;
  const maxY = Math.max(...Object.values(LAYOUT).map(p => p.y));
  const H = maxY * UY + NH + 2 * PADM;
  const svg = document.getElementById("minimap-svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };

  const pos = id => ({
    x: Math.max(NW/2 + 2, Math.min((LAYOUT[id].x / 100) * W, W - NW/2 - 2)),
    y: H - PADM - NH / 2 - LAYOUT[id].y * UY,
  });
  // expand junction dots: "builds on" = direct prereqs (through a junction), "leads to" = modules that list this one
  const expand = ids => [].concat(...ids.map(p => byId[p].junction ? byId[p].prereqs : [p]));
  const before = new Set(expand(mod.prereqs));
  const after = new Set(MODULES.filter(m => !m.junction && m.id in LAYOUT && expand(m.prereqs).includes(mod.id)).map(m => m.id));

  // edges: highlighted when they touch this module
  for (const [from, to] of EDGES) {
    if (!(from in LAYOUT) || !(to in LAYOUT)) continue;
    const a = pos(from), b = pos(to), fj = byId[from].junction, tj = byId[to].junction;
    const y1 = fj ? a.y : a.y - NH/2, y2 = tj ? b.y : b.y + NH/2, my = (y1 + y2) / 2;
    const inEdge  = to === mod.id || (tj && mod.prereqs.includes(to) && before.has(from));
    const outEdge = (from === mod.id && (after.has(to) || (tj && MODULES.some(m => after.has(m.id) && m.prereqs.includes(to))))) ||
                    (fj && after.has(to) && byId[from].prereqs.includes(mod.id));
    el("path", { d: `M ${a.x} ${y1} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${y2}`, fill: "none",
      stroke: inEdge ? "#3b6d11" : outEdge ? "#b8842b" : "#e1e4e7",
      "stroke-width": inEdge || outEdge ? 1.6 : 1, "stroke-dasharray": outEdge ? "4 3" : "none" });
  }
  for (const m of MODULES) {
    if (!m.junction || !(m.id in LAYOUT)) continue;
    const p = pos(m.id);
    el("circle", { cx: p.x, cy: p.y, r: 3, fill: "#a8b8c0" });
  }

  // nodes
  for (const id of Object.keys(LAYOUT)) {
    const m = byId[id];
    if (!m || m.junction) continue;
    const p = pos(id), cur = id === mod.id, pre = before.has(id), nxt = after.has(id);
    const g = el("g", { class: "mm-node" + (cur ? " cur" : ""), "data-id": id });
    el("title", {}, g).textContent = m.title + (cur ? " (you are here)" : pre ? " (builds on)" : nxt ? " (leads to)" : "");
    if (cur) el("rect", { class: "mm-halo", x: p.x - NW/2 - 3, y: p.y - NH/2 - 3, width: NW + 6, height: NH + 6, rx: 7, fill: "var(--accent-primary)" }, g);
    el("rect", { x: p.x - NW/2, y: p.y - NH/2, width: NW, height: NH, rx: 5,
      fill: cur ? "var(--accent-primary)" : pre ? "#e3f1d6" : nxt ? "#fff4e0" : "#fff",
      stroke: cur ? "var(--accent-dark)" : pre ? "#3b6d11" : nxt ? "#b8842b" : "#d4d8dc",
      "stroke-width": cur || pre || nxt ? 1.5 : 1, "stroke-dasharray": nxt ? "4 2" : "none" }, g);
    const t = el("text", { x: p.x, y: p.y + 0.5, "text-anchor": "middle", "dominant-baseline": "middle",
      "font-size": 9.4, "font-weight": cur || pre || nxt ? 600 : 400, "font-family": "Raleway, sans-serif",
      fill: cur ? "#fff" : pre ? "#2c520c" : nxt ? "#7a5513" : "#9aa0a6", "pointer-events": "none" }, g);
    t.textContent = LABEL[id] || m.short || "";
    if (!cur) g.addEventListener("click", () => travelTo(id));
  }
  // pin on the current module, drawn last so nothing covers it
  const pp = pos(mod.id);
  const pin = el("g", { transform: `translate(${pp.x + NW/2 - 4}, ${pp.y - NH/2 + 2})`, "pointer-events": "none" });
  el("path", { d: "M0 0 C -5 -7 -7 -9.5 -7 -13 A 7 7 0 1 1 7 -13 C 7 -9.5 5 -7 0 0 Z", fill: "#e8590c", stroke: "#fff", "stroke-width": 1.4 }, pin);
  el("circle", { cx: 0, cy: -13, r: 2.6, fill: "#fff" }, pin);
})();

/* travel animation */
let traveling = false;
function travelTo(target) {
  if (traveling) return;
  traveling = true;
  track("minimap_travel", { from_module: mod.id, to_module: target });
  const hops = shortestPath(mod.id, target);
  hops.forEach((id, i) => {
    setTimeout(() => {
      const r = document.querySelector(`#minimap-svg g.mm-node[data-id="${id}"]`);
      if (r) r.classList.add("hop");
      if (i === hops.length - 1)
        setTimeout(() => { location.href = `module.html?id=${target}`; }, 280);
    }, 140 * (i + 1));
  });
}

/* ---------- language toggle ---------- */
function applyLang() {
  const lang = getLang();
  const S = STRINGS[lang];
  document.documentElement.lang = lang;
  document.getElementById("lang-btn").textContent = S.lang_btn;
  document.getElementById("back-link").textContent = (lang === "fa" ? "→ بازگشت به نقشه" : "← back to the map");
  document.getElementById("minimap-label").textContent = S.minimap_label;
  renderHero();
  renderSections();
  renderNextPrev();

  // Scroll to mode section
  const modeEl = mode && STEPS_EN.includes(mode) ? document.getElementById(mode) : null;
  if (modeEl && modeEl.scrollIntoView) {
    setTimeout(() => modeEl.scrollIntoView({ behavior: "smooth" }), 80);
  }
}

document.getElementById("lang-btn").addEventListener("click", () => {
  const next = getLang() === "en" ? "fa" : "en";
  setLang(next);
  track("lang_toggle", { lang: next, module_id: mod.id });
  applyLang();
});

/* ---------- scroll-highlight step nav ---------- */
function initObserver() {
  if (mod.ref || typeof IntersectionObserver === "undefined") return;
  const navLinks = document.querySelectorAll(".step-nav a");
  const sections = [...STEPS_EN, "resources"];
  const obs = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting)
      navLinks.forEach(l => l.classList.toggle("current", l.dataset.k === e.target.id));
  }, { rootMargin: "-30% 0px -60% 0px" });
  sections.forEach(k => { const el = document.getElementById(k); if (el) obs.observe(el); });
}

/* ---------- init ---------- */
applyLang();
initObserver();
</script>
